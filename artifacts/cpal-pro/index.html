<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(){var t=localStorage.getItem("nurture-next-theme");document.documentElement.classList.add(t==="dark"?"dark":"light");})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Nurture Next | Premium Tax & Compliance Advisors</title>
    <meta
      name="description"
      content="Professional tax filing, GST, and business compliance managed by certified advisors with secure workflows and transparent pricing."
    />
    <meta name="theme-color" content="#0E1628" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- FrontDesk Widget — the same AccuMax embed any firm pastes into its site.
         Script URL, tenant and API come from the Vite env (.env / .env.production). -->
    <script
      src="%VITE_WIDGET_SRC%"
      data-nn-widget
      data-tenant="%VITE_WIDGET_TENANT%"
      data-api="%VITE_WIDGET_API%"
      async
    ></script>
  </body>
</html>
